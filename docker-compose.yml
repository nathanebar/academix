# Infra locale pour Academix : PostgreSQL + MinIO (S3)
# Usage : docker compose up -d
# Ports de l'hôte modifiables dans un fichier .env à la racine (voir README) :
#   POSTGRES_PORT (5432), MINIO_PORT (9000), MINIO_CONSOLE_PORT (9001)

# Image MinIO : minio/minio et minio/mc ne sont plus publiées sur Docker Hub.
# On utilise l'image Chainguard (contient aussi le client `mc`), épinglée par digest.
x-minio-image: &minio-image cgr.dev/chainguard/minio@sha256:548147b5fc95a67e3e45285dff7e0e50326c3eb1977c6218039461771156c5e7

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: academix_dev
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d academix_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: *minio-image
    restart: unless-stopped
    entrypoint: ["/usr/bin/minio"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_PORT:-9000}:9000"           # API S3
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # Console web
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Crée le bucket "academix" en lecture publique (le front lit les fichiers en lien direct)
  minio-init:
    image: *minio-image
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/academix &&
        mc anonymous set download local/academix

volumes:
  pgdata:
  miniodata:
